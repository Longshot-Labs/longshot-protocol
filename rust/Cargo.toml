[package]
name = "longshot-protocol"
version = "0.2.0"
edition = "2021"
description = "Transport-neutral Rust contracts and wire helpers for Longshot"
readme = "README.md"
license-file = "LICENSE.txt"
homepage = "https://longshot.xyz"
# Direct publication can embed private repository metadata. The release script
# enables crates.io only in its temporary Git-free source copy.
publish = false
include = ["src/**", "Cargo.toml", "README.md", "LICENSE.txt"]

[features]
default = []
openapi = ["dep:utoipa", "utoipa/uuid"]

[dependencies]
alloy-primitives = { version = "1", features = ["k256", "serde"] }
alloy-signer = { version = "1", default-features = false }
alloy-signer-local = { version = "1", default-features = false }
base64 = "0.22"
hex = "0.4"
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
smallvec = "1.13"
static_assertions = "1.1"
utoipa = { version = "4", optional = true }
uuid = { version = "1.23", features = ["v4", "serde"] }
